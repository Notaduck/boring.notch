# SwiftLint Configuration for boring.notch

# Paths to include in linting
included:
  - boringNotch

# Paths to exclude from linting
excluded:
  - Pods
  - .build
  - DerivedData
  - mediaremote-adapter

# Disabled rules (can be adjusted based on project needs)
disabled_rules:
  - trailing_whitespace
  - todo
  - line_length

# Opt-in rules
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - multiline_parameters
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Rule configurations
file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - i
    - j
    - k
    - x
    - y
    - z

reporter: "github-actions-logging"
