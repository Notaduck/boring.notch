name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint Analysis
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        id: swiftlint
        run: |
          swiftlint lint --reporter github-actions-logging > swiftlint-report.txt 2>&1 || true
          echo "SWIFTLINT_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          cat swiftlint-report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload SwiftLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftlint-report
          path: swiftlint-report.txt

  code-signing-check:
    name: Code Signing Verification
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Check Entitlements
        id: entitlements
        run: |
          echo "Checking for entitlements file..."
          if [ -f "boringNotch/boringNotch.entitlements" ]; then
            echo "✅ Entitlements file found"
            echo "ENTITLEMENTS_STATUS=✅ Found" >> $GITHUB_OUTPUT
            echo "Contents:"
            cat boringNotch/boringNotch.entitlements
          else
            echo "⚠️  Entitlements file not found"
            echo "ENTITLEMENTS_STATUS=⚠️ Not Found" >> $GITHUB_OUTPUT
          fi
      
      - name: Check Info.plist
        id: infoplist
        run: |
          echo "Checking for Info.plist..."
          if [ -f "boringNotch/Info.plist" ]; then
            echo "✅ Info.plist found"
            echo "INFOPLIST_STATUS=✅ Found" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Info.plist not found"
            echo "INFOPLIST_STATUS=⚠️ Not Found" >> $GITHUB_OUTPUT
          fi
      
      - name: Verify Project Settings
        id: project_settings
        run: |
          echo "Checking project code signing settings..."
          if grep -q "CODE_SIGN_IDENTITY" boringNotch.xcodeproj/project.pbxproj; then
            echo "✅ Code signing identity configured"
            echo "SIGNING_STATUS=✅ Configured" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Code signing identity not found"
            echo "SIGNING_STATUS=⚠️ Not Configured" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Boring Notch
    needs: [swiftlint, code-signing-check]
    if: always()
    strategy:
      matrix:
        platform:
          - macOS
        xcode:
          - ^16
        scheme:
          - boringNotch
    runs-on: macos-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Build with xcodebuild
        id: xcodebuild
        uses: mxcl/xcodebuild@v3
        with:
          xcode: ${{ matrix.xcode }}
          platform: ${{ matrix.platform }}
          scheme: ${{ matrix.scheme }}
          action: build
          verbosity: xcpretty
          upload-logs: always
          configuration: release
        continue-on-error: true
      
      - name: Extract Build Errors
        id: extract_errors
        if: steps.xcodebuild.outcome == 'failure'
        run: |
          echo "BUILD_FAILED=true" >> $GITHUB_OUTPUT
          echo "Extracting build errors..."
          
          # Create error report
          cat > build-errors.txt << 'EOF'
          # Build Failure Report
          
          ## Workflow Information
          - Run ID: ${{ github.run_id }}
          - Repository: ${{ github.repository }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          
          ## Build Errors
          
          EOF
          
          # Try to extract errors from xcodebuild logs
          if [ -d "${{ steps.xcodebuild.outputs.logs-path }}" ]; then
            echo "Checking logs in: ${{ steps.xcodebuild.outputs.logs-path }}"
            find "${{ steps.xcodebuild.outputs.logs-path }}" -name "*.log" -exec grep -H -A 5 "error:" {} \; >> build-errors.txt 2>&1 || true
          fi
          
          # Also check for any .log files in the current directory
          find . -maxdepth 2 -name "*.log" -exec grep -H -A 5 "error:" {} \; >> build-errors.txt 2>&1 || true
          
          # If no errors found, add a generic message
          if ! grep -q "error:" build-errors.txt; then
            echo "Build failed but no specific error messages were extracted." >> build-errors.txt
            echo "Please check the full build logs for details." >> build-errors.txt
          fi
          
          echo "Error report created"
          cat build-errors.txt
      
      - name: Upload Build Errors
        if: steps.xcodebuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build-errors.txt
          retention-days: 7
      
      - name: Set Build Success
        id: build_success
        if: steps.xcodebuild.outcome == 'success'
        run: |
          echo "BUILD_FAILED=false" >> $GITHUB_OUTPUT
          echo "✅ Build succeeded!" > build-status.txt
          echo "BUILD_STATUS=✅ Success" >> $GITHUB_OUTPUT
      
      - name: Set Build Failure
        if: steps.xcodebuild.outcome == 'failure'
        run: exit 1

  comment-pr:
    name: Comment on PR
    needs: [swiftlint, code-signing-check, build]
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download SwiftLint Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: swiftlint-report
      
      - name: Download Build Errors
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-errors
      
      - name: Create PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ needs.build.result }}';
            const swiftlintStatus = '${{ needs.swiftlint.result }}';
            const codeSigningStatus = '${{ needs.code-signing-check.result }}';
            
            let comment = '## 🔍 CI/CD Build Report\n\n';
            
            // Build Status
            comment += '### Build Status\n';
            if (buildStatus === 'success') {
              comment += '✅ **Build Passed**\n\n';
            } else if (buildStatus === 'failure') {
              comment += '❌ **Build Failed - Compilation Errors Detected**\n\n';
              comment += '🚨 **This PR introduces compilation errors and cannot be merged.**\n\n';
              
              // Try to read and include build errors
              const fs = require('fs');
              let buildErrors = '';
              try {
                if (fs.existsSync('build-errors.txt')) {
                  buildErrors = fs.readFileSync('build-errors.txt', 'utf8');
                  // Limit to first 2000 characters to avoid huge comments
                  if (buildErrors.length > 2000) {
                    buildErrors = buildErrors.substring(0, 2000) + '\n\n... (truncated, see full logs for details)';
                  }
                }
              } catch (error) {
                console.log('Could not read build errors:', error.message);
              }
              
              if (buildErrors) {
                comment += '#### Build Error Details\n\n';
                comment += '```\n' + buildErrors + '\n```\n\n';
              }
              
              comment += 'Please check the [build logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for complete details.\n\n';
              comment += '**Common issues:**\n';
              comment += '- Type errors (missing or incorrect types)\n';
              comment += '- Missing dependencies or imports\n';
              comment += '- Syntax errors\n';
              comment += '- Generic parameter inference issues\n\n';
              
              // Mention @copilot for automatic iteration
              comment += '---\n\n';
              comment += '@copilot Please review the build errors above and fix the compilation issues.\n\n';
            } else {
              comment += '⚠️  **Build Status Unknown**\n\n';
            }
            
            // SwiftLint Status
            comment += '### SwiftLint Analysis\n';
            if (swiftlintStatus === 'success') {
              comment += '✅ **SwiftLint Passed** - No major issues found\n\n';
            } else {
              comment += '⚠️  **SwiftLint Warnings** - Check the [SwiftLint report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details\n\n';
            }
            
            // Code Signing Status
            comment += '### Code Signing Verification\n';
            if (codeSigningStatus === 'success') {
              comment += '✅ **Code Signing Configuration Verified**\n\n';
            } else {
              comment += '⚠️  **Code Signing Issues Detected** - Check the [code signing logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n';
            }
            
            comment += '---\n';
            comment += `📊 [View Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if build failed
        if: needs.build.result == 'failure'
        run: |
          echo "::error::Build failed with compilation errors. Please fix the errors before merging."
          exit 1
